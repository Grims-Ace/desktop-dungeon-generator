[package]
name = "desktop_dungeon_generator"
version = "0.5.0"
edition = "2024"

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.15"
tiny-skia = "0.11"
image = { version = "0.25", default-features = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
